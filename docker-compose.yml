name: expense-bot
# -----------------------------------
# Production Expense Tracker Bot stack
#  - PostgreSQL database
#  - DeepSeek AI integration
#  - Telegram Bot API
#  - Node.js application
# -----------------------------------
services:
  expense-bot:
    build: .
    image: expense-bot:latest
    container_name: expense-bot
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: n8n-stack_proxy
